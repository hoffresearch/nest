[package]
name = "nest-cli"
description = "sovereign embedded vector database: single-file .nest container with content-addressable citations, offline-first"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[[bin]]
name = "nest"
path = "src/main.rs"

# cargo-binstall: `cargo binstall nest-cli` fetches the prebuilt binary from
# the github release instead of compiling (issue #75). names match the
# cargo-dist archive layout; windows ships a .zip, everything else .tar.xz.
[package.metadata.binstall]
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
nest-format = { workspace = true }
nest-runtime = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
memmap2 = { workspace = true }
rand = "0.10"
hex = "0.4"
sha2 = { workspace = true }
