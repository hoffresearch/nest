# urna-ingest is a SEPARATE cargo workspace. it lives under crates/ but
# the root manifest excludes it from the sovereign workspace, so the
# (eventually heavy, possibly non-deterministic) forge ingestion deps --
# pdf, ocr, clip, fonttools -- never enter urna-format / urna-engine.
# this crate is FORGE-0a: the frozen .fci schema only. build/test it from
# the repo root:
#   cargo build --manifest-path crates/ingest/Cargo.toml
#   cargo test  --manifest-path crates/ingest/Cargo.toml
[package]
name = "urna-ingest"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "forge canonical intermediate (.fci) schema, outside the sovereign urna workspace"
repository = "https://github.com/hoffresearch/urna"
# internal ingestion layer, not a crates.io package.
publish = false

[workspace]
resolver = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
