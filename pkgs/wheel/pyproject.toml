# maturin project for the official `urna` wheel (issue #75).
#
# tool/tasks/wheelprep.py copies this file VERBATIM into pkgs/stage/;
# every relative path below resolves from stage/, not from pkgs/wheel/.
# the dev flow is unchanged: `cargo build --release -p urna-bridge --features
# pyo3/extension-module`, then copy target/release/lib_urna.dylib (macos) or
# lib_urna.so (linux) to rust/bridge/python/urna/_urna.so; this file only
# feeds the published package.

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "urna"
description = "Offline-first vector database in one file: a .urna container with content-addressable citations, read from Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hoff Research", email = "brenner@hoffresearch.com" }]
keywords = ["vector-database", "embeddings", "offline-first", "rag", "citations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Database :: Database Engines/Servers",
]
dynamic = ["version"]

# offline text embedding with the bundled potion table (urna.embed.potiontab).
# optional: the core library surface (open/search/validate/...) needs nothing
# beyond the wheel itself.
[project.optional-dependencies]
embed = ["numpy>=1.26", "tokenizers>=0.20"]

[project.urls]
Homepage = "https://urna.dev"
Documentation = "https://docs.urna.dev"
Repository = "https://github.com/hoffresearch/urna"
Issues = "https://github.com/hoffresearch/urna/issues"

# `uvx --from urna urna ...` / `pipx run`: read-only verbs (validate,
# inspect, stats, search) over the library api. the full cli (ask, retrieve,
# doctor, ...) is the rust binary from tool/tasks/installer.sh.
[project.scripts]
urna = "urna.entry.clidriver:main"

[tool.maturin]
manifest-path = "../../rust/bridge/Cargo.toml"
module-name = "urna._urna"
python-source = "."
features = ["pyo3/extension-module"]
