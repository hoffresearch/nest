project: nest
last-updated: "2026-08-10"
domain: architecture
summary: "single-file semantic knowledge stack: rust owns format, runtime, cli, and bindings; python owns ingestion, model fingerprinting, and support tooling. p1#07 (G1) added the optional chunk-to-chunk graph_adjacency (0x0C) csr + search-graph. p1#08 stood up the agent-native flagship over the EXISTING engine: cli `ask`/`retrieve` + python NestFile.retrieve (offline potion embed, model_hash gate, capability route, tier-1 cited spans whose score IS the exact rerank value) + the additive SearchExplain honesty backbone (rerank_source: real cosine vs real cosine at stored precision). 2026-08-10: the media blob pillar (F4b) brought codec-backed media INTO the container (blob_refs 0x14 + blob_span_overlay 0x16, capabilities_ext.blobs_present) and the multimodal space pillar (F4c) added the space_table 0x15 registry plus per-space embedding slabs in the 0x20-0x2F band behind capabilities_ext.supports_multimodal, each space gated by its own model_hash in isolation; F5 added the build-time levers gop_policy=auto probe, sharding, similarity ordering, and the dtype ladder for image corpora. all additive, content_hash-excluded, zero format bytes changed for text corpora, no NEST_FORMAT_VERSION bump; verb-collapse / nest dev / nest-profile deferred."
