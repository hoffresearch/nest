[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.5.3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/hoffresearch/urna"
homepage = "https://urna.dev"
readme = "README.md"
keywords = ["vector-database", "embeddings", "search", "offline", "citations"]

# workspace-wide lint policy (every crate opts in with `[lints] workspace =
# true`). the two `deny`s are the hardening contract of docs/SECURITY.md made
# mechanical: a runtime that opens third-party files may not panic on an
# `unwrap`, and every `unsafe` block must state the invariant that makes it
# sound (`// SAFETY:`). tests are exempt from `unwrap_used` via clippy.toml.
[workspace.lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
memmap2 = "0.9"
rayon = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
zstd = { version = "0.13", default-features = false, features = ["experimental", "zdict_builder"] }
half = { version = "2", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
# path for the workspace, version for crates.io: `cargo publish` strips the
# path and keeps the version, so both move with every release bump.
urna-format = { path = "crates/urna-format", version = "0.5.3" }
urna-runtime = { path = "crates/urna-runtime", version = "0.5.3" }

# distribution backbone for the `urna` cli binary (issue #75): per-platform
# tarballs + sha256 checksums + the homebrew tap formula, the npm package
# and the crates.io publish, all driven from tags on main. the documented
# one-liner installer is scripts/install.sh
# (it also lays down the offline embedder payload, which dist installers do
# not model), so dist's own shell/powershell installers stay disabled.
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = ["github"]
# npm ships the same release archive behind `npm i -g @urna/cli` (the
# package fetches the binary on install; name set in crates/urna-cli). npm
# refuses the bare name `urna` (too similar to url, lerna, ora), so it lives
# in the `urna` org.
npm-scope = "@urna"
installers = ["homebrew", "npm"]
tap = "hoffresearch/homebrew-urna"
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
install-path = "~/.local/bin"
pr-run-mode = "plan"
# homebrew needs HOMEBREW_TAP_TOKEN, npm needs NPM_TOKEN, and the custom
# crates.io job (.github/workflows/publish-crates.yml) needs
# CARGO_REGISTRY_TOKEN, all repo secrets; see the maintainer checklist.
publish-jobs = ["homebrew", "npm", "./publish-crates"]
# the installed-product test runs after the release is announced. it cannot
# listen for `release: published`: the release is created with
# GITHUB_TOKEN, and events from that token start no workflows.
post-announce-jobs = ["./install-test"]
# a custom job gets `id-token` + `packages` by default, which zeroes
# `contents`; the crates job checks out the tag, so it asks for read (and
# keeps id-token for a later move to crates.io trusted publishing).
github-custom-job-permissions = { "publish-crates" = { contents = "read", id-token = "write" }, "install-test" = { contents = "read" } }
# sigstore keyless provenance for every release artifact, verifiable with
# `gh attestation verify` (issue #75).
github-attestations = true
# supply chain: a cyclonedx sbom per release artifact,
# uploaded next to it and covered by the same attestations; binaries built
# with cargo-auditable so `cargo audit bin urna` can read the dependency
# tree out of the executable. the tag-verify job runs in the plan phase and
# blocks the build when the release tag is not signed by a key listed in
# .github/allowed_signers.
cargo-cyclonedx = true
cargo-auditable = true
plan-jobs = ["./tag-verify"]

# build only the packages that ship (the `urna` cli crate). without it dist compiles the
# whole workspace per target, and urna-python's cdylib cannot be built for
# the musl targets, which failed the first 0.5.0 tag on both linux builds.
precise-builds = true
# no source.tar.gz: dist builds it with git archive, which smudges every
# lfs file (the demo corpora) and fails while the lfs budget is exhausted.
# github attaches the source archives to every release anyway.
source-tarball = false

# the embedder payload stages the potion table; the build setup fetches it
# from its upstream and checks it against the lfs pointer (no git-lfs).
github-build-setup = "../dist-build-setup.yml"

# the offline embedder payload (staged by scripts/stage_embedder_payload.py
# and packed as one artifact) ships next to the binary archives so the
# one-liner installer can lay it down under the data dir and a released
# binary passes `urna doctor` with no network and no repo checkout.
[[workspace.metadata.dist.extra-artifacts]]
# the payload is built in dist's global job, which does not run
# github-build-setup, so the build fetches the potion table itself.
build = [
    "sh",
    "-c",
    "sh scripts/fetch_potion.sh && python3 scripts/stage_embedder_payload.py target/dist-payload --tar target/urna-embedder-payload.tar.gz",
]
artifacts = [
    "target/urna-embedder-payload.tar.gz",
    "target/urna-embedder-payload.tar.gz.sha256",
]

# cargo-dist builds with this profile (thin lto over release).
[profile.dist]
inherits = "release"
lto = "thin"
