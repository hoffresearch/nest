[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/hoffresearch/nest"
homepage = "https://github.com/hoffresearch/nest"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
memmap2 = "0.9"
rayon = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
zstd = { version = "0.13", default-features = false, features = ["experimental", "zdict_builder"] }
half = { version = "2", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
nest-format = { path = "crates/nest-format" }
nest-runtime = { path = "crates/nest-runtime" }

# distribution backbone for the `nest` cli binary (issue #75): per-platform
# tarballs + sha256 checksums + the homebrew tap formula, all driven from
# tags on main. the documented one-liner installer is scripts/install.sh
# (it also lays down the offline embedder payload, which dist installers do
# not model), so dist's own shell/powershell installers stay disabled.
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = ["github"]
installers = ["homebrew"]
tap = "hoffresearch/homebrew-nest"
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
install-path = "~/.local/bin"
pr-run-mode = "plan"
publish-jobs = ["homebrew"]

# the offline embedder payload (staged by scripts/stage_embedder_payload.py
# and packed as one artifact) ships next to the binary archives so the
# one-liner installer can lay it down under the data dir and a released
# binary passes `nest doctor` with no network and no repo checkout.
[[workspace.metadata.dist.extra-artifacts]]
build = [
    ["python3", "scripts/stage_embedder_payload.py", "target/dist-payload/share"],
    ["tar", "-czf", "target/nest-embedder-payload.tar.gz", "-C", "target/dist-payload", "share"],
]
artifacts = ["target/nest-embedder-payload.tar.gz"]

# cargo-dist builds with this profile (thin lto over release).
[profile.dist]
inherits = "release"
lto = "thin"
