# Python tooling configuration.
#
# The DEV flow does NOT install a Python package — the PyO3 extension is
# built by `cargo build --release -p nest-python` and copied into
# `python/_nest.so`. The Python source under `python/` and `tests/` is
# imported directly by adding `python/` to `sys.path`.
#
# The PUBLISHED package is the `nestdb` wheel, a maturin project owned by
# `packaging/pyproject.toml` and staged by `scripts/stage_wheel.py` (see
# doc/install.md). This root file stays the dev-tooling config: it exists
# so `ruff` (and any other PEP 518 tool) finds a canonical config at the
# workspace root.
#
# The one exception to "no install path" is the forge SEMANTIC default
# embedder (python/forge/embed_potion.py): it loads a vendored, offline
# model2vec/potion table and needs numpy + tokenizers at runtime (no
# torch, no network). They are declared as a PEP 735 dependency group so
# the requirement is recorded without claiming a publishable package.
# Install with:  uv pip install numpy tokenizers   (or: uv sync --group forge)
# The lexical floor (python/forge/embed_default.py) stays stdlib-only.

[dependency-groups]
forge = [
    "numpy>=1.26",
    "tokenizers>=0.20",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "python/__pycache__",
    "**/_nest.so",
    "**/*.dylib",
    "**/*.dll",
]

[tool.ruff.lint]
# E,F = pycodestyle errors + pyflakes
# W   = pycodestyle warnings
# I   = isort
# B   = flake8-bugbear
# UP  = pyupgrade
# SIM = flake8-simplify
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# `nest` is the package name and is detected by `sys.path.insert`, not
# by a regular install — silence the unused-import false positives that
# come from re-exporting a C extension.
ignore = ["E402", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
