# Python tooling configuration.
#
# The DEV flow does NOT install a Python package: the PyO3 extension is
# built by `cargo build --release -p urna-bridge --features
# pyo3/extension-module` and copied into `python/_urna.so` (the feature
# keeps libpython out of the cdylib). The Python source under `python/` and `tests/` is
# imported directly by adding `python/` to `sys.path`.
#
# The PUBLISHED package is the `urna` wheel, a maturin project owned by
# `packs/pyproject.toml` and staged by `script/wheelprep.py` (see
# the reference section of docs/USAGE.md). This root file stays the dev-tooling config: it exists
# so `ruff` (and any other PEP 518 tool) finds a canonical config at the
# workspace root.
#
# The one exception to "no install path" is the forge SEMANTIC default
# embedder (python/forge/embed_potion.py): it loads a vendored, offline
# model2vec/potion table and needs numpy + tokenizers at runtime (no
# torch, no network). They are declared as a PEP 735 dependency group so
# the requirement is recorded without claiming a publishable package.
# Install with:  uv pip install numpy tokenizers   (or: uv sync --group forge)
# The lexical floor (python/forge/embed_default.py) stays stdlib-only.

[dependency-groups]
forge = [
    "numpy>=1.26",
    "tokenizers>=0.20",
    # image paths (image_backends, embed_image, embed_st) and the forge tests.
    "pillow>=10",
]
# import-graph contracts ([tool.importlinter] below). runs from python/ with
# the dev sys.path:  cd python && PYTHONPATH=. ../.venv/bin/lint-imports --config ../pyproject.toml
lint = [
    "import-linter>=2.15",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "python/__pycache__",
    "**/_urna.so",
    "**/*.dylib",
    "**/*.dll",
]

[tool.ruff.lint]
# E,F = pycodestyle errors + pyflakes
# W   = pycodestyle warnings
# I   = isort
# B   = flake8-bugbear
# UP  = pyupgrade
# SIM = flake8-simplify
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# `urna` is the package name and is detected by `sys.path.insert`, not by a
# regular install. E402 stays ignored for the path-bootstrap idiom; unused
# imports (F401) are enforced, with intentional re-exports declared via
# __all__ or a targeted noqa.
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
# first-party = what lives under python/ (sys.path.insert bootstrap), declared
# so the section split never depends on which dirs exist beside pyproject.
known-first-party = ["urna", "builder", "forge", "tools", "embed_query", "model_fingerprint", "convert_legacy", "urna_cli"]

# pyright is installed globally (uv tool install pyright) and used here only as
# an import-resolution check: type checking stays off, an unresolved import is
# an error. extraPaths mirrors the dev sys.path bootstrap (python/, python/tools/
# for the tests, script/). demos/ is excluded: it imports the published wheel
# layout (urna.embed_potion), not the dev tree. the remaining errors are the
# optional heavy backends (torch, sentence_transformers, open_clip, fitz, the
# bench competitors) that the dev venv does not install, plus _urna until the
# extension is built into python/_urna.so.
[tool.pyright]
include = ["python", "tests", "script"]
exclude = ["**/__pycache__", "target", "TMP", "packs/staging"]
extraPaths = ["python", "python/tools", "script"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "off"
reportMissingImports = "error"

# rope is not installed; run it on demand with `uv run --no-project --with rope`.
# source_folders mirrors the dev sys.path so a module move rewrites the imports
# in tests/ and python/tools/ too.
[tool.rope]
source_folders = ["python", "python/tools", "script"]
ignored_resources = [
    "*.pyc", "*~", ".ropeproject", ".git", ".venv", "__pycache__",
    "target", "TMP", "data", "docs", "fuzz", "packs/staging", "demos",
]
save_objectdb = false
save_history = false

# forge is the library layer, python/tools the bench/CLI layer on top of it:
# tools may import forge, forge never imports tools.
[tool.importlinter]
root_packages = ["forge", "tools"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "forge does not import tools"
type = "forbidden"
source_modules = ["forge"]
forbidden_modules = ["tools"]
