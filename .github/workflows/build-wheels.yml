# build the `urna` wheels inside the release run. a reusable workflow:
# cargo-dist calls it as a custom local-artifacts job (`local-artifacts-jobs`
# in Cargo.toml), so the host job and every publish job wait for it and a
# wheel that does not build, or a tag that fails its signature or preflight
# (the first job here), stops the release before any channel publishes.
#
# one abi3 wheel per platform (cp312, matching pyo3 abi3-py312), built by
# maturin from the staged project (scripts/stage_wheel.py). each wheel gets a
# `<wheel>.sha256` (`<hex> *<name>`, the archives' format) and a sigstore
# build attestation. the upload is named `artifacts-wheel-*`, so the host job
# attaches the wheels and their checksums to the github release; pypi.yml
# publishes those same files and checks them against these checksums.

name: build-wheels

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  # the release tag's signature and preflight. here rather than in dist's
  # plan phase so a refused tag fails this call and the host job never runs
  # (see the plan-jobs note in Cargo.toml); on a branch ref it is a no-op.
  tag-verify:
    name: tag signature and preflight
    uses: ./.github/workflows/tag-verify.yml

  wheels:
    name: wheel ${{ matrix.target }}
    needs: [tag-verify]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # sigstore build attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: universal2-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: fetch the potion table the wheel bundles (verified against its lfs pointer)
        shell: bash
        run: sh scripts/fetch_potion.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: stage the wheel project
        run: python scripts/stage_wheel.py
      - name: build the abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: packaging/staging
          target: ${{ matrix.target }}
          args: --release --out ../../dist-wheels
      - name: checksum each wheel
        shell: bash
        working-directory: dist-wheels
        run: |
          set -eu
          for wheel in *.whl; do
            python -c "import hashlib,sys; p=sys.argv[1]; print(hashlib.sha256(open(p,'rb').read()).hexdigest(), '*' + p)" "$wheel" > "$wheel.sha256"
            cat "$wheel.sha256"
          done
      - name: attest the wheels
        uses: actions/attest@v4
        with:
          subject-path: dist-wheels/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-wheel-${{ matrix.target }}
          path: |
            dist-wheels/*.whl
            dist-wheels/*.whl.sha256
