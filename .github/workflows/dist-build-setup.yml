# cargo-dist `github-build-setup` steps (see [workspace.metadata.dist] in
# Cargo.toml). injected into the release build jobs before anything builds.
# the embedder payload stages the git-lfs potion table, so fetch lfs objects
# (checkout only pulls pointers by default). every step needs a `name`, the
# dist template requires it.
- name: fetch git-lfs objects (potion table for the embedder payload)
  run: git lfs install && git lfs pull
