# post-release verification (issue #75): tests the INSTALLED product, not
# the build. for every released platform this downloads the release
# artifacts exactly the way a user does (one-liner installer against the
# release download url), then runs `urna validate` on the golden fixture
# and `urna doctor` with real numpy/tokenizers. a second job installs the
# binary through each package channel (homebrew, npm, cargo binstall),
# which ships the bare binary, and proves `urna setup --yes` completes it:
# payload from the tagged release, a python env built from a runner python
# that has no numpy, then `urna doctor`. a third job pip-installs the
# published wheel and repeats validate + the uvx console entry point.
#
# trigger: a published github release (created by the dist workflow), or
# manual dispatch with a tag. if this fails, the release is broken for
# users; yank and re-cut.

name: install-test

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to test (e.g. v0.3.0)
        required: true

permissions:
  contents: read

jobs:
  cli:
    name: cli ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6 # scripts + golden fixture (not lfs)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install embedder python deps
        run: python -m pip install numpy tokenizers

      - name: install urna from the release (unix)
        if: runner.os != 'Windows'
        env:
          URNA_RELEASE_BASE: https://github.com/hoffresearch/urna/releases/download/${{ env.TAG }}
        run: sh scripts/install.sh

      - name: install urna from the release (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          URNA_RELEASE_BASE: https://github.com/hoffresearch/urna/releases/download/${{ env.TAG }}
        run: ./scripts/install.ps1

      - name: validate the golden fixture (unix)
        if: runner.os != 'Windows'
        # from outside the checkout: in the repo the embedder resolves to
        # python/forge first, whose potion table is an lfs pointer here.
        working-directory: ${{ runner.temp }}
        env:
          URNA_PYTHON: python
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          urna validate "$GITHUB_WORKSPACE/crates/urna-format/tests/fixtures/golden_v1_minimal.urna"
          urna doctor

      - name: validate the golden fixture (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          URNA_PYTHON: python
        run: |
          $env:PATH = "$HOME\.local\bin;$env:PATH"
          urna validate "$env:GITHUB_WORKSPACE\crates\urna-format\tests\fixtures\golden_v1_minimal.urna"
          urna doctor

  channels:
    name: ${{ matrix.channel }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { channel: homebrew, os: macos-latest }
          - { channel: homebrew, os: ubuntu-24.04 }
          - { channel: npm, os: ubuntu-24.04 }
          - { channel: npm, os: macos-latest }
          - { channel: npm, os: windows-latest }
          - { channel: binstall, os: ubuntu-24.04 }
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6 # golden fixture
      # a bare interpreter on purpose: setup must build the numpy +
      # tokenizers env itself (pip path; uv is not on the runner).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        if: matrix.channel == 'npm'
        with:
          node-version: "22"

      - name: install (homebrew)
        if: matrix.channel == 'homebrew'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew install hoffresearch/urna/urna
          dirname "$(brew --prefix)/bin/urna" >> "$GITHUB_PATH"
      - name: install (npm)
        if: matrix.channel == 'npm'
        run: npm install -g "@urna/cli@${TAG#v}"
      - name: install (cargo binstall)
        if: matrix.channel == 'binstall'
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y urna --version "${TAG#v}"

      - name: the bare binary reports what is missing
        working-directory: ${{ runner.temp }}
        run: |
          urna --version
          urna doctor && exit 1 || echo "doctor fails before setup, as it should (exit $?)"
      - name: urna setup completes the install
        working-directory: ${{ runner.temp }}
        run: urna setup --yes --version "$TAG"
      - name: doctor and validate after setup
        working-directory: ${{ runner.temp }}
        run: |
          urna doctor
          urna validate "$GITHUB_WORKSPACE/crates/urna-format/tests/fixtures/golden_v1_minimal.urna"

  wheel:
    name: wheel ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6 # golden fixture
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install uv
        run: python -m pip install uv
      - name: pip install urna and validate
        run: |
          python -m pip install urna
          python -c "import urna; assert urna.potion_model_path(), 'potion table must be bundled'"
          python -c "import urna; urna.open('crates/urna-format/tests/fixtures/golden_v1_minimal.urna').validate(); print('validate ok')"
          urna validate crates/urna-format/tests/fixtures/golden_v1_minimal.urna
      - name: uvx entry point
        run: uvx --from urna urna validate crates/urna-format/tests/fixtures/golden_v1_minimal.urna
