summary = "Single-file semantic knowledge stack: Rust owns format, runtime, CLI, and bindings; Python owns ingestion, model fingerprinting, and support tooling. p1#07 (G1) added the optional chunk-to-chunk graph_adjacency (0x0C) CSR + search-graph. p1#08 stood up the agent-native flagship over the EXISTING engine: CLI `ask`/`retrieve` + Python UrnaFile.retrieve (offline potion embed, model_hash gate, capability route, tier-1 cited spans whose score IS the exact rerank value) + the additive SearchExplain honesty backbone (rerank_source: real cosine vs real cosine at stored precision). 2026-08-10: The media blob pillar (F4b) brought codec-backed media INTO the container (blob_refs 0x14 + blob_span_overlay 0x16, capabilities_ext.blobs_present) and the multimodal space pillar (F4c) added the space_table 0x15 registry plus per-space embedding slabs in the 0x20-0x2F band behind capabilities_ext.supports_multimodal, each space gated by its own model_hash in isolation; F5 added the build-time levers gop_policy=auto probe, sharding, similarity ordering, and the dtype ladder for image corpora. All additive, content_hash-excluded, zero format bytes changed for text corpora, no URNA_FORMAT_VERSION bump; verb-collapse / urna dev / urna-profile deferred. 2026-08-11: The distribution surface (issue #75) landed: cargo-dist CLI releases (5 targets, SHA256, Sigstore attestations, Homebrew tap), the maturin `urna` wheel with the bundled potion table (abi3 cp312, OIDC trusted publishing), one-liner installers, `urna doctor` with typed exit codes, the minimal Docker image, and offline integration examples. 2026-08-31: Declarative builds + model registry + compression levers (RFCs 0-5, no format change): `urna build --spec corpus.toml` launches python/tools/urna_forge.py -> forge/build_spec.py (TOML contract, SpecError names the key, total-order enforcement) -> forge/corpus_sources.py (sqlite/csv/jsonl/image_dir rows with per-item input_hash) -> forge/forge_pipeline.py (transactional stages, dedup via shared 0x16 spans, triad-keyed embed caches model_hash+recipe_hash+input_hash, single/per-model/both outputs from one embed pass, manifest_schema_version=1 + build.lock.json); forge/model_registry.py holds the model presets (potion/clip-vit-b32/siglip2/jina-v5-omni/wemm-2b|4b|9b/fake-test) with validated MRL ladders, remote-code opt-in + pinned hash allowlist, and subprocess-isolated ST adapters (one worker per model via forge/embed_st_worker.py -- two trust_remote_code ST models in one process collide in transformers dynamic modules, measured); forge/quality_gate.py is the dual crf=auto gate (stratified ssimulacra2 floors + embedding-drift floor); jxl/jxl-transcode backends are the lossless modes (round-trip verified); CLI grew search-space, build, stats/inspect spaces, benchmark --space, and cmd/embed_gate.rs (the ONE copy of the three-layer model gate, routing ask/retrieve by manifest model through forge/embed_query_model.py); python/tools/urna_model_bench.py compares models in three never-aggregated tiers. 2026-09-03: Single-asset access + frontend bridge (no format change): UrnaFile.chunk_ids() (chunk identity in file order) and UrnaFile.blob_bytes(i) (one inlined 0x17 blob without exporting the store) landed in urna-python; python/tools/urna_ui_bridge.py is the JSON bridge any frontend drives a corpus through (browse with media resolved to blob URI + shard-local frame via SHA256 segment matching, search in every mode with hits matched by chunk_id, single-blob extraction); the bench now matches by chunk_id (ordinal==offset only held for single-shard unordered video; cluster and per-image corpora silently zeroed) and expands ${ENV} placeholders in redacted manifest paths. Measured full-corpus: retrieval-only AV1 crf50 = 7.8x with hit@k parity against the lossless twin while the drift floor would have vetoed it (drift is stability, not utility; a hit@k gate floor is the registered follow-up, landed 2026-09-12 as the utility leg); AVIF q48 = the crf35 still class's drift at -20% bytes; the AV1/AVIF twins share one content_hash across a backend swap. 2026-09-05: Hardening pass driven by an external review: workspace deny lints unwrap_used + undocumented_unsafe_blocks, urna_format::bytes typed field readers, bytemuck views replacing the layout/int8 raw-parts casts (urna-format has zero unsafe), release-kept asserts at the SIMD safe/unsafe boundary, allocation-free int4 rerank (caller scratch), deterministic mutation-fuzz harnesses in both crates + four cargo-fuzz targets under fuzz/ (first runs found and fixed four malformed-file panic classes: unchecked n*dim, NaN reaching a partial_cmp sort, wrapping cursor bounds checks, unvalidated BM25 postings), .github/workflows/ci.yml (the first workflow to run cargo test on a pull request), the CLI regrouped into engine verbs (cmd/*) and agent verbs (cmd/agent/*), and docs/BENCH.md measured against usearch / hnswlib / sqlite-vec / LanceDB. 2026-09-18: docs/arc consolidated into a single docs/arc/ARC.toml (previously the arc.yaml + arc.mmd pair plus the arc.schema.json IDE-validation schema); doc-location change only, no architecture, format, or runtime change. 2026-09-22: `doc/` renamed to `docs/` and `dat/` to `data/` (paths only); examples/quickstart/ added (JSONL + potion spec + Python twin, the five-verb loop from a clean checkout). 2026-09-26: The release feeds two more channels, configured and not yet published: crates.io (urna-format, urna-runtime, urna-cli in dependency order via the custom cargo-dist publish job .github/workflows/publish-crates.yml; urna-python and forge-core publish = false) and npm (`@urna/cli`, the cargo-dist npm installer fetching the release archive); the Homebrew formula is named `urna`. 2026-09-26 (later): The terminal UI, behind the default-on `tui` feature of urna-cli (Ratatui 0.30 + tachyonfx; urna-cli's own rust-version moves to 1.88, the format and runtime crates keep 1.85): `urna setup` is the installer every channel ends in (scan, plan, install, verify; downloads the embedder payload through a system `curl` child with the SHA256 checked while it streams, unpacks through a staging dir, builds a managed Python env at <data root>/urna/venv with uv or venv+pip, proves the result with the doctor checks; plain lines with --yes or without a terminal; exit codes 10-14 above doctor's 2-6) and `urna tui` (also a bare `urna` on a terminal) is the corpus explorer (manifest + validate verdict, section table, ask through the same embed_gate, the doctor checks, a hand-off to setup and back). The doctor checks became data (cmd/health.rs) shared by doctor, setup and the explorer; the data roots became one ladder (cmd/paths.rs: URNA_DATA_DIR, XDG_DATA_HOME, ~/.local/share, %LOCALAPPDATA%, <exe>/../share), which also fixes the Windows one-liner payload the CLI never searched; the interpreter ladder gained the setup venv right after URNA_PYTHON. The binary still links no network stack. No format or runtime change. 2026-09-26 (release): The release and wheel jobs stopped pulling git-lfs (the repo ran out of LFS budget on the first 0.5.0 tag); scripts/fetch_potion.sh downloads the potion table from its pinned upstream revision and checks it against the LFS pointer's SHA256, so a release spends no LFS bandwidth. The CLI crate publishes as `urna` (`cargo install urna`) while npm refuses the bare `urna` (too similar to url, lerna, ora), so the npm package stays `@urna/cli`; the directory stays crates/urna-cli, dist release archives are urna-<target>. 2026-09-27: Every change ends with the afterwork walk (.contracts/.ai/.agents/.skills/afterwork/AFTERWORK.md, mirrored as checkboxes in .github/pull_request_template.md): each doc a change owns is updated in place, history stays in the changelog, the commit and the PR. 2026-09-29: The flagship search route is by capability, not by the declared index_type: MmapUrnaFile::search_routed (BM25 section + query text -> hybrid, HNSW section -> ann, else exact; the graph only through search_graph) is the one route ask, retrieve, search-text and the Python UrnaFile.retrieve (new `query_text` kwarg) share, so a `hybrid` preset file (index_type hnsw, supports_bm25 true) runs its BM25 leg from the CLI. No format change. 2026-09-29: The release payload carries the registry query embedder (embed_query_model.py, the registry, its adapters, model_fingerprint.py) so an installed binary asks wemm/clip/jina corpora once their deps are in the setup venv; `tests/test_embedder_payload.py` runs the staged tree from outside the checkout (the ninth gate suite). 2026-09-29: The hash contract is stated as the layout has it: header and section checksums are 8-byte SHA-256 prefixes, file_hash covers the whole file (the footer digest covers everything before it), content_hash the decoded canonical sections. 2026-09-29: The contract names every encoding and section id the writer emits (intpack 4, zstd_dict 5, fsst 9, txt_streams 10, dictionary 0x0A, dedup_map 0x0B, blob_data 0x17 were missing from the agents contract's list). 2026-09-29: The standalone image tool (urna_build_image_corpus.py, image_corpus.py) is described as what it writes: a .media/ sidecar and the default space; the in-file media layout and the named spaces belong to the declarative build. 2026-09-29: `urna cite` resolves spans through urna_runtime::apply_blob_span_overlay (the 0x16 overlay the runtime applies at open), so a media corpus cites the blob span retrieve reports; `urna validate` runs every check before printing; forge --rebuild-only never rewrites the build lock (a divergent rebuild writes <name>.build.lock.rebuild.json). No format change. 2026-10-02: CITATION.cff at the root carries the citation metadata of the released version; no code change. 2026-10-02 (#262, task 1): An installed urna queries a sentence-transformers corpus: the payload carries urna/embed_query.py, model_fingerprint.py and VERSION beside forge/ and setup lays them all down (never a directory but forge/, so never the venv); setup replaces a payload of another release or without the stamp in its own data dir; the MiniLM is the st_text preset minilm-multilingual, sharing embed_query.py's load/encode/fingerprint so old corpora keep their model_hash; installed_script_in takes a path under python/ so search-text resolves through the data roots; embed failures are typed (cmd/embed_failure.rs); the benchmark rebuild is atomic (_bench_runner). After review: the payload install is one restorable step (cmd::payload::REQUIRED checked first, the previous payload moved aside and restored on failure, kept at <root>/.urna-previous-* and named in the error when the restore itself fails, VERSION last; REQUIRED is every shipped file), setup repairs a payload missing a required file, and the benchmark keeps a live run's temporary. No format or runtime change. 2026-10-02 (later): The pt-BR corpus build left the repo: python/tools/urna_build_corpus.py and _corpus_sources.py are gone (their upstream CSVs and one mirror no longer exist, so they could not run), the python-corpus-build flow with them; data/corpus_next.v1.urna stays in LFS as the frozen gate baseline, identified by its file_hash in data/demo/Instructions.md and data/measure/baseline.json, and the pinned, rebuildable corpus lives in the fakenews-ptbr-urna-benchmark repo. No code, format or gate change. 2026-10-02 (#262, task 2): Optional model install. The registry carries an InstallSpec for each preset whose install was validated end to end (pinned revision, exact files, model_hash; today minilm-multilingual), model_catalog.py generates python/forge/catalog.json from it with every other preset and its reason, and the payload ships it beside forge/install_model.py. One install (tui/setup/models.rs) serves urna setup (a models step, the picker, --model NAME|all, --allow-remote-code NAME, exit 15) and the explorer's install panel (tui/app/offer.rs): packages only into the managed venv, the pinned files into the shared HF cache, the fingerprint checked against the catalog and the corpus, the download and repo code as two separate consents, the query run again on success. install-test checks every channel's payload carries the catalog. No format or runtime change; urna-format, urna-runtime, the wheel and Docker are untouched. 2026-10-02 (later): open_clip presets can pin a hub snapshot (hf_repo, revision, weights_file, snapshot_files), separate from InstallSpec; SigLIP2 does, and model_registry.pinned_snapshot resolves snapshots/<revision> of the HF cache (never refs/main), so embed_image.py loads the checkpoint into the built-in architecture with the tag's preprocess (model_hash unchanged) and the tokenizer through local-dir: from the same snapshot. The SigLIP2 text tower runs offline; a missing file is SnapshotMissing, exit 3 with urna-fetch. 2026-10-03: the #271 merge had dropped those four ModelPreset fields while the SigLIP2 preset kept using them, so the registry did not import; restored, and CI's python job now runs model_catalog.py --check, which imports the registry under a bare python. No format or runtime change. 2026-10-03 (0.5.2): The release ships the MIT text in the three crates (crates/*/LICENSE link to docs/LICENSE) and in the wheel (license-files); the Docker image builds the engine-only CLI with --locked and --no-default-features from a pinned toolchain image. No format or runtime change. 2026-10-03 (0.5.3): the v0.5.2 tag reached PyPI only, because the release global job stages the payload with ubuntu-22.04 python3 (3.10) and the VERSION stamp imported tomllib; scripts/stage_embedder_payload.py falls back to reading [workspace.package] and 0.5.3 is the release for every channel. No format or runtime change. 2026-10-03 (release automation, preflight): scripts/release_preflight.py checks that the version agrees across the pins, the lockfile, CITATION.cff and the changelog on every pull request, and tag-verify.yml runs it in tag mode after the signature (tag name, commit on main, tag date), so a mismatched tag stops before any build. 2026-10-03 (release automation, wheels and PyPI): the wheels build inside the release run (build-wheels.yml, a dist local-artifacts job) so the host and every publish job wait for them, and the release carries them with a .sha256 and an attestation each; PyPI moved from its own tag-triggered run to the publish-pypi job, which dispatches the top-level pypi.yml on the tag (trusted publishing does not take a reusable workflow) and waits for it; the upload is idempotent per sha256. The tag check moved from dist plan-jobs into build-wheels.yml: a failed plan job only skips the builds, and dist's host runs on skipped builds. No format or runtime change. 2026-10-04 (release automation, rehearsal): release-rehearsal.yml, generated from release.yml by scripts/release_rehearsal.py, runs the release's own build jobs on pull requests and pushes to main without publishing (read-only, no secrets, no attestations), checks the artifacts, the payload VERSION and the Linux binary, and gives the required rehearsal check; build-wheels.yml takes its caller's permissions so the read-only rehearsal can call it. CI stages the payload under Python 3.10. No format or runtime change. 2026-10-04 (release automation, channels): install-test's registry legs wait for the exact version (scripts/release_channels.py), and release-report.yml summarizes every completed release run, failed or cancelled included, by the triggering run's id and commit. No format or runtime change. 2026-10-04 (release automation, preparation): scripts/release_prepare.sh opens the release pull request with a pinned cargo-release; release dates and the tag check are UTC days. 2026-10-04 (afterwork): .contracts/.ai/.agents/ holds the shared Portuguese instructions and the final review procedure with its conditional specs.yaml catalog; AGENTS.md and CLAUDE.md at the root link to the same source. 2026-10-04 (later): ARC.toml moved from docs/arc/ to docs/ beside the other docs; doc-location change only. 2026-10-04 (later): docs/ADR/ holds the architecture decision records and reference lessons, one folder per category, each record from docs/ADR/TEMPLATE.md with a searchable YAML header. 2026-10-04 (later): AFTERWORK rewritten as nine steps matching nine epics; the agent builds its task list in its task tool before starting, so the tech lead can audit each item against the PR, and closing criteria state what must hold at the end. 2026-10-04 (later): the root llms.txt is gone; it is a site convention no tool reads from a repository, and docs.urna.dev/llms.txt is the one index. 2026-10-04 (later): LICENSE moved from docs/ to the root, where GitHub detects it, and the Dockerfile from docker/ to the root, so `docker build .` needs no -f; paths only. 2026-10-04 (later): the root AGENTS.md and CLAUDE.md links are gone; .contracts/.ai/.agents/AGENTS.md is the one instruction source, and each contributor points their own agent tooling at it."

system_view = [
    "urna-format is the frozen v1 container contract. It owns layout, manifest, reader, writer, canonical sections, hashes, and wire encodings. Embeddings stay raw float32, float16, int8, or int4 (fixed-stride quant only); zstd is reserved for non-embedding sections.",
    "urna-engine opens .urna files through mmap, validates queries, dispatches SIMD, and executes exact, ANN, graph, and hybrid search while reranking candidates with real cosine. That hot path is why embeddings are never zstd-compressed.",
    "urna-clitui is a thin clap surface over the runtime and format crates. It carries the twelve engine subcommands (inspect, validate, stats, media, search, search-text, search-ann, search-graph, search-space, benchmark, cite, doctor: file + vector in; only search-text and doctor spawn Python) and the three agent verbs (ask, retrieve, build: text or spec in, shell out to the offline Python embedder / forge), tagged [engine] / [agent] in --help. ask and retrieve are the agent-native flagship verbs layered over the engine (text query in, cited answer out; both embed the query offline with the default potion static table, validate the embedder's model_hash against the manifest exactly like search-text, and route by what the file carries through MmapUrnaFile::search_routed: hybrid when a BM25 section is present, hnsw when an HNSW section is present, exact otherwise; ask prints one cited answer (--disclose answer) or adds the rerank-source honesty line + route + candidate counts (--disclose explain); retrieve emits the agent-shaped JSON/JSONL answer-pack where each hit's score IS the exact-cosine rerank value). doctor is the post-install health check with typed exit codes (0 ok, 2 Python missing, 3 deps missing, 4 embedder missing, 5 potion table missing, 6 embedder run failed). Behind the default-on `tui` feature the CLI also carries the terminal UI in src/tui: `setup` (the interactive installer, exit codes 10 download, 11 checksum, 12 unpack, 13 Python env, 14 blocked, 15 a model install; --model installs catalog models) and `tui` (the corpus explorer; a bare `urna` on a terminal opens it, in a pipe it prints the help and exits 2). Verb-collapse, the urna dev namespace, and the urna-profile crate are deferred.",
    "The distribution layer (issue #75) turns tags on main into installs: cargo-dist builds the CLI for five targets with SHA256 checksums, Sigstore keyless attestations on the five archives, one CycloneDX SBOM for the CLI package, a Homebrew tap formula (`urna`) and an npm package (`@urna/cli`), and publishes urna-format / urna-engine / urna-clitui (the CLI crate, binary `urna`) to crates.io; maturin builds the `urna` abi3 wheel with the potion table bundled (offline embedding after pip install); script/install.sh / install.ps1 are the one-liner installers (verify-before-write, --version, --uninstall); urna doctor validates the install offline and `urna setup` completes the channels that ship the bare binary (Homebrew, npm, crates.io); .github/workflows/setuptest.yml tests the INSTALLED product per platform after each release, including a job per package channel that waits for the exact version on its registry and ends in `urna setup --yes` + `urna doctor`; .github/workflows/runreport.yml summarizes every completed release run, failed or cancelled included. Three levels of evidence, not interchangeable: script/fullcheck.sh is the full local gate (no release build), rehearsal.yml builds the release on pull requests and publishes nothing, and only a tag exercises publishing, setuptest and the report.",
    "urna-bridge is the PyO3 bridge. python/urna.py loads the compiled extension, python/builder.py orchestrates chunking and caching, and python/embed_query.py preserves model parity for search-text. The agent-native flagship is UrnaFile.retrieve(query, k, ...): a pre-embedded query in, cited spans out, whose score IS the exact rerank value, with tier-1 stored canonical text + hashes + citation_id + rerank-source marker.",
    "script/fullcheck.sh is the release gate: rebuilds the extension, runs Rust and Python suites, checks lint and format, measures presets, and compares against the committed baseline.",
    "crates/urna-ingest is the ingestion layer, a SEPARATE cargo workspace under crates/ that the root Cargo.toml excludes, so its (eventually heavy, possibly non-deterministic) deps never enter urna-format or urna-engine. This phase ships FORGE-0a: the frozen .fci canonical-intermediate schema only. It is not built by the sovereign release gate; it has its own cargo workspace.",
    "python/forge is the forge Python surface. Its build-side default is an offline semantic static embedder (python/forge/embed_potion.py): a vendored model2vec/potion-base-8M table (MIT, dim 256, ~30MB via git-lfs), numpy + tokenizers only, no torch, no network round-trip; it self-fingerprints to a SHA256 model_hash recorded in provenance. The #04 lexical bag-of-words (python/forge/embed_default.py) stays as the stdlib-only zero-dependency floor/fallback.",
    "The image corpus path is Python-only and stays in the forge tooling layer, because a vision tower needs torch and the sovereign runtime does not take that dependency; no format or runtime code depends on it and the .urna it emits is an ordinary .urna. python/forge/image_items.py owns discovery (sorted, reproducible: an item's position IS its corpus ordinal, its frame number, and the byte_start its citation resolves through). python/forge/image_media.py, image_encode.py (+ image_encode_still.py for AVIF/JXL, image_gop_probe.py for the probe), and image_backends.py (+ image_backends_av1.py for the stream) own the codec path: images are letterboxed onto one canvas, frames move through a rawvideo pipe, the encoded frame count is verified against the item count, and gop_policy=auto probe-encodes both directions before choosing. Every codec backend (av1, avif, jxl, jxl-transcode) records media.source_bytes as the byte size of the original source files, so compression_ratio is one quantity across them (the AVIF letterboxed PNG sum is kept apart as letterboxed_input_bytes; the png-lossless control reports output_bytes only, it is the ruler). python/forge/embed_image.py fingerprints the weights actually loaded plus the preprocess transform, and rejects a bare architecture name with no pretrained tag. A corpus is corpus.urna beside corpus.media/ plus corpus.manifest.json, or, since the media blob pillar, the media travels inside the .urna itself via blob_refs (0x14) + blob_span_overlay (0x16).",
]

contract = [
    "Required sections are chunk_ids, chunks_canonical, chunks_original_spans, embeddings, provenance, and search_contract. Optional sections are hnsw_index, bm25_index, graph_adjacency (0x0C, G1), blob_refs (0x14), space_table (0x15), blob_span_overlay (0x16), and blob_data (0x17).",
    "Additive section ids past the implemented 0x01-0x08 are reserved in one reconciled, disjoint map in layout/mod.rs: 0x09-0x10 (scalar reservations: embeddings_fp, dictionary, dedup_map, graph_adjacency, chunk_scalars, tokenizer_model, edit_journal, repro_manifest), 0x11-0x17 (graph_nodes, graph_edge_props, graph_entity_map, blob_refs, space_table, blob_span_overlay, blob_data), and the per-space bands 0x20-0x2F (space embeddings) and 0x30-0x3F (space fp). All are excluded from content_hash and unresolved by section_name until their feature ships. graph_adjacency (0x0C), blob_refs (0x14), space_table (0x15), blob_span_overlay (0x16), and blob_data (0x17) are ACTIVE: they join OPTIONAL_SECTIONS behind the additive manifest capabilities graph_present, blobs_present, and supports_multimodal, stay OUT of CANONICAL_SECTIONS, and keep a media or multimodal corpus citation-identical to its text-only twin. tests/reserved_ids.rs asserts the bands stay disjoint and content_hash-safe.",
    "The graph pillar (G1) ships the chunk-to-chunk CSR in SECTION_GRAPH_ADJACENCY (0x0C): intpack offsets, a per-(src,edge_type)-run delta-gapped neighbor-id blob, and an edge-type column (NEXT_CHUNK=0, SEMANTIC=1, CITATION=2), canonically sorted so two builds are byte-identical. Runtime graph::CsrIndex parses it off mmap into flat offsets+neighbors; graph::Traversal::bounded_bfs walks it with a generational visited buffer. search_graph seeds the exact-cosine top-ef, bounded-bfs-expands the union, then feeds it to the same score_subset exact rerank; falls back to exact when no 0x0C section is present.",
    "The media blob pillar ships the self-contained single-file layout in SECTION_BLOB_REFS (0x14) and SECTION_BLOB_SPAN_OVERLAY (0x16), both typed-error on every truncation and hostile-count bounds before any allocation. blob_refs is a table of media records (URI, byte length, SHA256, media kind); the overlay maps chunk ordinals to blob-relative spans and rewrites blob-pointing spans in place at open, so cite and retrieve report real blob-relative byte ranges instead of ordinal placeholders. SECTION_BLOB_DATA (0x17) completes it: an offset table PARALLEL to the 0x14 record order plus the raw inlined media bytes, opened lazily (the runtime slices one blob off the mmap, never copies the section), populated by [output] embed_media in the forge and served by `urna media <file> [--export DIR]` with per-blob SHA256 verification in both export and `urna validate`. All three stay OUT of CANONICAL_SECTIONS, so adding or inlining blobs never moves a citation. Frame extraction stays in the Python tooling: decode needs the codec, and the sovereign runtime does not take that dependency.",
    "The multimodal space pillar ships SECTION_SPACE_TABLE (0x15) plus the per-space vector bands 0x20-0x2F (fp sources 0x30-0x3F) behind capabilities_ext.supports_multimodal. Each space carries its own name, model_hash, dim, and dtype; bands follow the embeddings encoding rule (dtype encodings only, never zstd). Runtime search_space(name, query, k, expected_model_hash) scores the band with the shared exact-cosine kernel off mmap; the text paths never read a band and the space path never reads 0x04, so a text query can never be scored against vision by accident.",
    "Wire encodings reserve ids 4-10 (intpack, zstd_dict, frontcode, int4, rabitq, fsst, txt_streams); decode_payload dispatches through a context-free wire-codec registry. fsst (9), zstd_dict (5, via decode_payload_with_dict), int4 (7), intpack (4), and txt_streams (10) are implemented; frontcode (6) and rabitq (8) stay reserved-but-unimplemented and rejected.",
    "raw and zstd apply to non-embedding payloads, plus the content_hash-preserving repacks (intpack, txt_streams/zstd_dict/fsst). float16, int8, and int4 apply only to embeddings. Embeddings never use zstd because the runtime scores them directly from mmap through the SIMD path, and are never dict/fsst/dedup-touched.",
    "Matryoshka prefix truncation is a build-time dimension lever orthogonal to and multiplicative with value precision: urna.build(mrl_dim=K) slices each l2-normalized f32 row to its first K components and re-l2-normalizes on the prefix BEFORE quantization. The header/manifest embedding_dim becomes K and the source dim is recorded as full_dim; no runtime kernel change, since the reader strides exclusively by header.embedding_dim. int4 still needs the effective dim divisible by 64, so the multiplicative int4 ladder is valid only at mrl_dim in {256,192,128}.",
    "The four integrity surfaces are header_checksum, section checksum over physical bytes, file_hash over the whole pre-footer body, and content_hash over decoded canonical sections.",
    "The manifest is covered by file_hash, never content_hash. New manifest fields must be additive: Option with skip_serializing_if, so an unset field serializes to nothing. New capability flags go in the optional capabilities_ext or the flattened extra map, never as new required bools on Capabilities. tests/manifest_additivity.rs is the guard.",
    "Exact search is always the ground truth path. HNSW and hybrid search return final hits only after exact cosine rerank.",
    "The mandatory exact rerank reads through one explicit rerank source (runtime/src/rerank.rs): the full-precision embeddings_fp (0x09) slab when present, else the stored dtype slab, so the returned score is always real cosine (at stored precision unless an fp source is present). Every candidate-generating path (ANN, hybrid, graph, space) ends in this source; runtime/tests/rerank_contract.rs asserts the returned score equals the exact rerank byte-for-byte and recall is NaN for every non-exact path.",
    "Every SearchResult carries an additive SearchExplain (runtime/src/lib.rs): the route (exact/hnsw/graph/hybrid), the per-path candidate counts, the fusion_mode, the recall_estimate, and the load-bearing rerank_source (RerankSourceKind::FullPrecision = real cosine, vs StoredPrecision = real cosine at stored precision) so a sub-int8 corpus can never present a stored-precision score as full-precision.",
    "The optional embeddings_fp (0x09) section is a fixed-stride raw slab (float32 or float16, never zstd) read at open.",
    "Citation ids use the form urna://content_hash/chunk_id, so references remain stable across raw versus zstd text encodings.",
]

quality = [
    "The format and runtime emphasize deterministic layout, typed errors, and checksum-verified reads.",
    "Embeddings stay mmap-friendly on disk: raw float32, float16, int8, or int4 (fixed-stride quant) only; zstd is reserved for non-embedding sections so search can stay zero-copy and SIMD-driven.",
    "The CLI stays intentionally thin and delegates behavior to runtime and format crates.",
    "The Python surface is small and explicit: load extension, build corpora, fingerprint models, and run support tooling.",
    "ANN, graph, hybrid, and space paths always rerank with exact cosine, which keeps scores consistent across search modes.",
    "A malformed .urna may be rejected with a typed error, never with a panic: Clippy denies unwrap_used and undocumented_unsafe_blocks workspace-wide, urna-format carries zero unsafe (bytemuck views), fixed-width fields go through urna_format::bytes, header-derived sizes are overflow-checked, cursor bounds checks are written need > remaining, every scored slab (canonical, fp, bands) passes a finite-values gate at open, and every f32 sort is a NaN-last total order (urna_engine::order). The mutation-fuzz harnesses run under cargo test and CI; fuzz/ holds the coverage-guided targets.",
    "Media (blob_refs/blob_span_overlay) and multimodal spaces (space_table + bands) are additive and content_hash-excluded, so attaching them to a corpus never moves an existing text citation; each named space is gated by its own model_hash in isolation.",
]

risks = [
    "docs/ARC.toml is the single architecture reference (narrative, contract, quality, risks, inventory, and the Mermaid diagram, merged 2026-09-18 from the former arc.yaml + arc.mmd + arc.schema.json) and must be updated in the same change as any edit to boundaries, data flow, module layout, or runtime contract. There is no separate human-prose architecture doc.",
    "BM25 tokenization is intentionally simple and documented as weak for CJK, Thai, and Lao.",
    "python/_urna.so must be rebuilt after Rust changes that touch urna-format, urna-engine, or urna-bridge.",
    "crates/urna-ingest is a separate cargo workspace, excluded from the sovereign one by the root Cargo.toml, and must stay that way: its (eventually heavy) ingestion deps must never enter the sovereign workspace, and it is not built by the sovereign release gate, so it carries its own cargo build/test/fmt/clippy.",
]

